<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短视频链接下载器</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="titlebar">
        <div class="titlebar-brand">
          <img class="app-icon" src="../assets/app-icon.png" alt="" aria-hidden="true">
          <span>短视频链接下载器</span>
        </div>
        <div class="window-controls" aria-label="窗口控制">
          <button id="minimizeBtn" class="window-button" type="button" title="最小化" aria-label="最小化">-</button>
          <button id="maximizeBtn" class="window-button" type="button" title="最大化" aria-label="最大化">□</button>
          <button id="closeBtn" class="window-button close-window" type="button" title="关闭" aria-label="关闭">×</button>
        </div>
      </header>

      <section class="toolbar" aria-label="下载控制">
        <div>
          <h1>短视频链接下载器</h1>
          <p id="toolStatus">正在检查下载组件...</p>
        </div>
        <div class="toolbar-actions">
          <button id="openFolderBtn" class="secondary" type="button">打开目录</button>
        </div>
      </section>

      <section class="workspace">
        <aside class="panel controls-panel">
          <label class="field-label" for="pageUrlInput">页面链接</label>
          <input id="pageUrlInput" type="text" spellcheck="false" placeholder="粘贴抖音或微信视频号页面链接/分享文案；为空则打开抖音首页">

          <label class="field-label" for="linkInput">捕获视频链接</label>
          <textarea id="linkInput" spellcheck="false" readonly placeholder="先在内置捕获窗口播放抖音或微信视频号视频，再点击使用捕获视频。"></textarea>

          <label class="field-label" for="outputDir">保存目录</label>
          <div class="path-picker">
            <input id="outputDir" type="text" readonly>
            <button id="chooseDirBtn" class="icon-button" type="button" title="选择保存目录" aria-label="选择保存目录">...</button>
          </div>

          <label class="field-label">视频捕获</label>
          <div class="row compact-row">
            <button id="openCaptureBtn" class="secondary" type="button">打开捕获窗口</button>
            <button id="openDouyinHomeBtn" class="secondary" type="button">抖音首页</button>
            <button id="openWechatChannelsBtn" class="secondary" type="button">视频号入口</button>
            <button id="useCapturedBtn" class="secondary" type="button">使用捕获视频</button>
          </div>
          <p id="captureStatus" class="muted">未捕获视频流</p>

          <div class="actions">
            <button id="startBtn" class="primary" type="button">开始下载</button>
            <button id="cancelBtn" class="danger" type="button" disabled>取消任务</button>
          </div>
        </aside>

        <section class="task-area" aria-label="任务列表">
          <div class="task-header">
            <div>
              <h2>任务</h2>
              <p id="batchStatus">等待链接</p>
            </div>
            <button id="clearLogBtn" class="secondary" type="button">清空日志</button>
          </div>
          <div id="tasks" class="tasks empty-state">暂无任务</div>
          <pre id="logBox" class="log-box" aria-label="下载日志"></pre>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
